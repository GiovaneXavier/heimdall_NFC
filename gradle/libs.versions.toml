[versions]
agp                   = "8.4.0"
kotlin                = "2.0.21"
coreKtx               = "1.13.1"
appcompat             = "1.7.0"
lifecycleRuntime      = "2.8.3"
lifecycleViewModel    = "2.8.3"
activityCompose       = "1.9.0"
composeBom            = "2024.06.00"
navigationCompose     = "2.7.7"
hilt                  = "2.51"
hiltNavCompose        = "1.2.0"
retrofit              = "2.11.0"
okhttp                = "4.12.0"
kotlinxSerialization  = "1.7.1"
retrofitSerialization = "1.0.0"
room                  = "2.6.1"
sqlcipher             = "4.5.4"
securityCrypto        = "1.1.0-alpha06"
cameraX               = "1.3.4"
mlkitBarcode          = "17.3.0"
coil                  = "2.6.0"
coroutines            = "1.8.1"
splashscreen          = "1.0.1"
junit                 = "4.13.2"
mockk                 = "1.13.11"
turbine               = "1.1.0"
androidxTestCore      = "1.6.1"
robolectric           = "4.13"
espresso              = "3.6.1"
androidxJunit         = "1.2.1"

[libraries]
# AndroidX Core
androidx-core-ktx           = { group = "androidx.core",       name = "core-ktx",           version.ref = "coreKtx"          }
androidx-appcompat          = { group = "androidx.appcompat",   name = "appcompat",           version.ref = "appcompat"         }
androidx-lifecycle-runtime  = { group = "androidx.lifecycle",   name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntime" }
androidx-lifecycle-viewmodel= { group = "androidx.lifecycle",   name = "lifecycle-viewmodel-ktx", version.ref = "lifecycleViewModel" }
androidx-lifecycle-compose  = { group = "androidx.lifecycle",   name = "lifecycle-viewmodel-compose", version.ref = "lifecycleViewModel" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycleRuntime" }
androidx-activity-compose   = { group = "androidx.activity",    name = "activity-compose",    version.ref = "activityCompose"  }
androidx-splashscreen       = { group = "androidx.core",        name = "core-splashscreen",   version.ref = "splashscreen"     }

# Compose
compose-bom                 = { group = "androidx.compose",     name = "compose-bom",         version.ref = "composeBom"       }
compose-ui                  = { group = "androidx.compose.ui",  name = "ui"                                                   }
compose-ui-graphics         = { group = "androidx.compose.ui",  name = "ui-graphics"                                          }
compose-ui-tooling-preview  = { group = "androidx.compose.ui",  name = "ui-tooling-preview"                                   }
compose-material3           = { group = "androidx.compose.material3", name = "material3"                                      }
compose-animation           = { group = "androidx.compose.animation", name = "animation"                                      }
compose-foundation          = { group = "androidx.compose.foundation", name = "foundation"                                    }
compose-ui-tooling          = { group = "androidx.compose.ui",  name = "ui-tooling"                                           }
compose-ui-test-manifest    = { group = "androidx.compose.ui",  name = "ui-test-manifest"                                     }
compose-ui-test-junit4      = { group = "androidx.compose.ui",  name = "ui-test-junit4"                                       }
navigation-compose          = { group = "androidx.navigation",  name = "navigation-compose",  version.ref = "navigationCompose" }

# Hilt
hilt-android                = { group = "com.google.dagger",    name = "hilt-android",        version.ref = "hilt"             }
hilt-compiler               = { group = "com.google.dagger",    name = "hilt-android-compiler", version.ref = "hilt"           }
hilt-navigation-compose     = { group = "androidx.hilt",        name = "hilt-navigation-compose", version.ref = "hiltNavCompose" }

# Network
retrofit                    = { group = "com.squareup.retrofit2", name = "retrofit",           version.ref = "retrofit"         }
okhttp-logging              = { group = "com.squareup.okhttp3",   name = "logging-interceptor", version.ref = "okhttp"          }
retrofit-serialization      = { group = "com.jakewharton.retrofit", name = "retrofit2-kotlinx-serialization-converter", version.ref = "retrofitSerialization" }
kotlinx-serialization-json  = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }

# Room
room-runtime                = { group = "androidx.room",         name = "room-runtime",        version.ref = "room"             }
room-ktx                    = { group = "androidx.room",         name = "room-ktx",            version.ref = "room"             }
room-compiler               = { group = "androidx.room",         name = "room-compiler",       version.ref = "room"             }
sqlcipher                   = { group = "net.zetetic",           name = "android-database-sqlcipher", version.ref = "sqlcipher" }

# Security
security-crypto             = { group = "androidx.security",     name = "security-crypto",     version.ref = "securityCrypto"   }

# Camera
camerax-core                = { group = "androidx.camera",       name = "camera-core",         version.ref = "cameraX"          }
camerax-camera2             = { group = "androidx.camera",       name = "camera-camera2",      version.ref = "cameraX"          }
camerax-lifecycle           = { group = "androidx.camera",       name = "camera-lifecycle",    version.ref = "cameraX"          }
camerax-view                = { group = "androidx.camera",       name = "camera-view",         version.ref = "cameraX"          }
mlkit-barcode               = { group = "com.google.mlkit",      name = "barcode-scanning",    version.ref = "mlkitBarcode"     }

# Images
coil-compose                = { group = "io.coil-kt",            name = "coil-compose",        version.ref = "coil"             }

# Coroutines
coroutines-android          = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }

# Testing
junit                       = { group = "junit",                  name = "junit",               version.ref = "junit"            }
mockk                       = { group = "io.mockk",               name = "mockk",               version.ref = "mockk"            }
turbine                     = { group = "app.cash.turbine",        name = "turbine",             version.ref = "turbine"          }
coroutines-test             = { group = "org.jetbrains.kotlinx",  name = "kotlinx-coroutines-test", version.ref = "coroutines"   }
androidx-test-core          = { group = "androidx.test",           name = "core",                version.ref = "androidxTestCore" }
robolectric                 = { group = "org.robolectric",         name = "robolectric",         version.ref = "robolectric"      }
androidx-junit              = { group = "androidx.test.ext",       name = "junit",               version.ref = "androidxJunit"   }
espresso-core               = { group = "androidx.test.espresso",  name = "espresso-core",       version.ref = "espresso"        }

[plugins]
android-application         = { id = "com.android.application",            version.ref = "agp"    }
kotlin-android              = { id = "org.jetbrains.kotlin.android",        version.ref = "kotlin" }
kotlin-compose              = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-kapt                 = { id = "org.jetbrains.kotlin.kapt",           version.ref = "kotlin" }
kotlin-serialization        = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
hilt                        = { id = "com.google.dagger.hilt.android",      version.ref = "hilt"   }
